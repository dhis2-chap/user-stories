# User stories for the modeling platform: chap-core, chapkit, the SDKs and the
# model examples. Modeling App stories are in modeling-app.yaml. Format: see
# README.md.

- id: newcomer-first-eval
  reader: newcomer model developer
  goal: get a first model running and evaluated with `chap eval`
  notes: This is typically someone wanting to contribute models. Could be a master student, someone at a workshop, or someone completely independent. We should assume litle prior knowledge and not high tech compteance here.
  status: current
  starts_at:
    - repo: dhis2-chap/chap-core
      path: docs/external_models/newcomer.md
    - repo: dhis2-chap/minimalist_example
      path: README.md
  jira: [CLIM-374]

- id: wrap-existing-model
  reader: experienced modeller
  notes: This could be anyone that has developed their own model that is currently not compatible with Chap. This person might not have high tech competance. Could be using AI agent, but should also be possible to do this without.
  goal: wrap an existing model and evaluate it
  status: current
  starts_at:
    - repo: dhis2-chap/chap-core
      path: docs/external_models/experienced_modeller.md
    - repo: dhis2-chap/chapkit
      path: docs/index.md
  jira: [CLIM-373]

- id: install-chap-with-dhis2
  reader: DHIS2 implementer
  goal: install Chap next to DHIS2 and add models
  notes: Typically someone wanting to setup Chap themselves for playing around with it or demoing it, but could also be someone wanting this for more production-ready setup.
  status: current
  starts_at:
    - repo: dhis2-chap/chap-core
      path: docs/modeling-app/index.md

- id: chap-core-first-pr
  reader: chap-core contributor
  goal: set up a dev environment and open a first PR
  status: current
  starts_at:
    - repo: dhis2-chap/chap-core
      path: docs/contributor/index.md
  jira: [CLIM-374]
