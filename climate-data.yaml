# User stories for climate data. Format: see README.md.
#
# US-A to US-E are copied from section 4 of open-climate-service
# docs/project_description.md, so they exist in both places for now. The
# starting pages were picked from the OCS docs and have not been checked by
# the climate team.

- id: ocs-scheduled-climate-import  # US-A
  reader: data manager
  goal: import daily temperature and precipitation data into DHIS2 at a user-defined scheduled interval (e.g. nightly), automatically aggregated to org units
  starts_at:
    - repo: dhis2/open-climate-service
      path: docs/importing_to_dhis2.md
    - repo: dhis2/open-climate-service
      path: docs/scheduled_sync.md

- id: ocs-population-import  # US-B
  reader: data manager
  goal: import population data for the current year, automatically aggregated to org units
  starts_at:
    - repo: dhis2/open-climate-service
      path: docs/built_in_datasets.md
    - repo: dhis2/open-climate-service
      path: docs/importing_to_dhis2.md

- id: ocs-population-on-maps  # US-C
  reader: analyst
  goal: visualise high-resolution population data on DHIS2 Maps with styles adapted to the population density of the country
  starts_at:
    - repo: dhis2/open-climate-service
      path: docs/index.md

- id: ocs-preview-before-import  # US-D
  reader: analyst
  goal: preview climate data for an org unit of interest before importing it to DHIS2
  starts_at:
    - repo: dhis2/open-climate-service
      path: docs/web_interface.md

- id: ocs-custom-processing-step  # US-E
  reader: data manager
  goal: add a custom pre- or post-processing step (e.g. calculate consecutive rainy days) before importing the result to DHIS2
  starts_at:
    - repo: dhis2/open-climate-service
      path: docs/workflows.md
