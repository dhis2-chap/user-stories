# User stories that span several domains, for example someone setting up
# open-climate-service and chap-core together. Format: see README.md.

- id: install-full-stack
  reader: implementer
  goal: set up DHIS2, chap-core, the Modeling App and OCS, install a model, and have the Modeling App ready for an analyst. Should be possible on a real server, not only locally.
  status: current
  starts_at:
    - repo: dhis2-chap/chap-site
      path: docs/index.md
    - repo: dhis2-chap/chap-core
      path: docs/modeling-app/index.md
  done_when:
    - one page in our docs is the entry point, and it sends the reader to the DHIS2 installation guide and back
    - the Modeling App opens in DHIS2 and lists at least one model installed from the Model Marketplace
    - climate data from OCS is in DHIS2 as data elements
    - the docs say which versions of DHIS2, chap-core and OCS work together
  jira: [CLIM-924, CLIM-807]
  notes: >-
    The reader may not have DHIS2 yet. We still want the entry point in our
    docs, and send them on to the DHIS2 install guide from there. The chap-site
    front page is a guess for that entry point. CAPS is left out on purpose:
    see caps-pipeline.

- id: caps-pipeline
  reader: implementer
  goal: have CAPS fetch data through OCS, trigger predictions in Chap and write results back to DHIS2 on a schedule
  status: current
  starts_at: []
  jira: [CLIM-1134]
  notes: >-
    Split out of install-full-stack because the CAPS link is not ready yet.
    CAPS is built by HISP Tanzania, so part of this path runs through docs we
    do not own; our side has to point into them correctly.

- id: covariate-from-ocs-to-modeling-app
  reader: analyst at the MOH
  goal: get a climate variable, for example rainfall, into DHIS2 so I can use it as a covariate in the Modeling App
  status: current
  starts_at:
    - repo: dhis2/open-climate-service
      path: docs/importing_to_dhis2.md
  done_when:
    - the variable is a data element in DHIS2 with values for my org units
    - the Modeling App lets me pick it as a covariate
  notes: >-
    The dependency Knut's notes point at: a covariate has to exist as a DHIS2
    data element, set up through OCS or CAPS, before the Modeling App can use
    it. Probably the path most countries stumble on.

- id: operator-upgrade-stack
  reader: operator
  goal: upgrade chap-core, the Modeling App and OCS without losing data or models
  status: current
  starts_at:
    - repo: dhis2-chap/chap-core
      path: docs/modeling-app/index.md
  done_when:
    - after the upgrade, existing evaluations, prediction setups and installed models are still there
  notes: >-
    "Keep it updated" used to be part of install-chap-with-dhis2 in
    modeling.yaml. Set to current on the assumption that upgrading is
    documented; check.

- id: decision-maker-act-on-prediction
  reader: decision maker
  goal: see this period's prediction for my area and decide whether to act on it
  status: planned
  starts_at: []
  notes: >-
    Where this person works is open: the Modeling App, a dashboard, a bulletin
    or the Early Warning app (CLIM-1619, and the "Reaching decision makers"
    initiative on the roadmap). National or district level is also open. Not
    the same as judging a model: this is one period's forecast.
